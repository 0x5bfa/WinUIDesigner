name: CI

on:
  push:
    paths-ignore:
      - '.github/assets/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - '.github/assets/**'
      - 'docs/**'
      - '*.md'

run-name: ${{ github.event_name == 'pull_request' && 'WinUIDesigner PR Validation' || 'WinUIDesigner CI Validation' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        shell: pwsh
        run: |
          msbuild .\WinUIDesigner.slnx /restore /p:Configuration=Release /p:DeployExtension=false /nologo /verbosity:minimal /m
